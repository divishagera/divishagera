name: Field log

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 05:47 IST
  workflow_dispatch:
  push:
    paths: ["build/**", "data/repos.json"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli numpy contourpy
      - name: Rebuild plates with live GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python build/build.py --live --field-log-only
          else
            python build/build.py --live
          fi
      - name: Commit if changed
        run: |
          git config user.name "atelier-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          git diff --cached --quiet || (git commit -m "field log: refresh $(date -u +%F)" && git push)
